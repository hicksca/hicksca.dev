name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install hut
        run: go install git.sr.ht/~xenrox/hut@latest

      - name: Configure hut
        env:
          SRHT_TOKEN: ${{ secrets.SRHT_TOKEN }}
        run: |
          mkdir -p ~/.config/hut
          printf 'instance "sr.ht" {\n  access-token "%s"\n}\n' "$SRHT_TOKEN" > ~/.config/hut/config
          chmod 600 ~/.config/hut/config

      - name: Build and publish
        run: ./publish.sh
